name: GMK Player Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore debug keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "DEBUG_KEYSTORE_BASE64 secret is available. Decoding to ${GITHUB_WORKSPACE}/debug.keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/debug.keystore"
            chmod 600 "${GITHUB_WORKSPACE}/debug.keystore"
          elif [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
            echo "Repository file debug.keystore.base64 is available. Decoding to ${GITHUB_WORKSPACE}/debug.keystore..."
            base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${GITHUB_WORKSPACE}/debug.keystore"
            chmod 600 "${GITHUB_WORKSPACE}/debug.keystore"
          fi

          if [ -f "${GITHUB_WORKSPACE}/debug.keystore" ] && [ -s "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            echo "Debug keystore created successfully and is non-empty."
          fi

      - name: Ensure consistent debug keystore
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/debug.keystore"
          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Canonical debug.keystore is missing. Refusing to generate a random key to avoid signature mismatch."
            exit 1
          fi
          echo "Canonical debug.keystore is present and verified. Building with consistent signing identity."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GMK-Player-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

